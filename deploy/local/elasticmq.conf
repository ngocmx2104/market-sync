include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  sync-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "sync-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  sync-jobs-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
}
